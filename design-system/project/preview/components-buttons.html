<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 22px 28px; font-family: var(--font-body); color: var(--color-text); display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 20px; font-size: 14px; font-weight: 500; border-radius: 8px; border: none; cursor: pointer; }
  .primary { background: #3f8a6e; color: #fff; }
  .secondary { background: #1a1a24; color: #e2e2ea; border: 1px solid #2e2e3e; }
  .ghost { background: transparent; color: #9393a8; }
  .danger { background: #c14b5e; color: #fff; }
  .lg { padding: 12px 24px; font-size: 16px; border-radius: 12px; }
  .roll { height: 42px; padding: 0 20px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(135deg, #3f8a6e, #2f6b54); color: #fff; box-shadow: 0 4px 15px rgba(63,138,110,0.40); border-radius: 8px; }
  .ico { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ico--lg { width: 18px; height: 18px; }
</style></head>
<body>
  <button class="btn primary">
    <svg class="ico" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Salvar
  </button>
  <button class="btn secondary">
    <svg class="ico" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Editar
  </button>
  <button class="btn ghost">Cancelar</button>
  <button class="btn danger">
    <svg class="ico" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    Excluir
  </button>
  <button class="btn primary lg">
    <svg class="ico ico--lg" viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
    Iniciar Encontro
  </button>
  <button class="btn roll">
    <svg class="ico" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    ROLL
  </button>
</body></html>
