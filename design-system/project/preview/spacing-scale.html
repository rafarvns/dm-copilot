<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 22px 28px; font-family: var(--font-body); color: var(--color-text); }
  .row { display:flex; align-items:center; gap: 14px; margin-bottom: 8px; }
  .lbl { width: 90px; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
  .bar { background: var(--color-primary); height: 18px; border-radius: 4px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); }
</style></head>
<body>
  <div class="row"><span class="lbl">space-1</span><div class="bar" style="width:4px;"></div><span class="px">4 px · 0.25rem</span></div>
  <div class="row"><span class="lbl">space-2</span><div class="bar" style="width:8px;"></div><span class="px">8 px · 0.5rem</span></div>
  <div class="row"><span class="lbl">space-3</span><div class="bar" style="width:12px;"></div><span class="px">12 px · 0.75rem</span></div>
  <div class="row"><span class="lbl">space-4</span><div class="bar" style="width:16px;"></div><span class="px">16 px · 1rem</span></div>
  <div class="row"><span class="lbl">space-5</span><div class="bar" style="width:20px;"></div><span class="px">20 px · 1.25rem · card pad</span></div>
  <div class="row"><span class="lbl">space-6</span><div class="bar" style="width:24px;"></div><span class="px">24 px · 1.5rem · view pad</span></div>
  <div class="row"><span class="lbl">space-8</span><div class="bar" style="width:32px;"></div><span class="px">32 px · 2rem</span></div>
  <div class="row"><span class="lbl">space-10</span><div class="bar" style="width:40px;"></div><span class="px">40 px · 2.5rem</span></div>
  <div class="row"><span class="lbl">space-12</span><div class="bar" style="width:48px;"></div><span class="px">48 px · 3rem</span></div>
</body></html>
