<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 22px 28px; color: var(--color-text); }
  .row { display:flex; align-items:baseline; gap: 18px; padding: 8px 0; border-bottom: 1px dashed var(--color-border); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); width: 180px; flex-shrink:0; }
  .spec { font-family: var(--font-display); }
</style></head>
<body>
  <div class="row"><span class="meta">Nodesto · 700 · 40px</span><span class="spec" style="font-size:40px; font-weight:700;">A Mina do Rei Anão</span></div>
  <div class="row"><span class="meta">Nodesto · 700 · 32px</span><span class="spec" style="font-size:32px; font-weight:700;">Encontros</span></div>
  <div class="row"><span class="meta">Nodesto · 400 · 26px</span><span class="spec" style="font-size:26px; font-weight:400;">Confirmar Exclusão</span></div>
  <div class="row"><span class="meta">Nodesto · 400 · 22px italic</span><span class="spec" style="font-size:22px; font-weight:400; font-style:italic;">Aliados &amp; Inimigos</span></div>
</body></html>
