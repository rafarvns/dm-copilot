<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 22px; font-family: var(--font-body); color: var(--color-text); display:flex; gap: 18px; align-items: center; }
  .die { display:flex; flex-direction:column; align-items:center; gap: 6px; }
  .die img { width: 48px; height: 48px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
  .die .name { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); }
</style></head>
<body>
  <div class="die"><img src="../assets/dice/d4.png" alt=""><span class="name">d4</span></div>
  <div class="die"><img src="../assets/dice/d6.png" alt=""><span class="name">d6</span></div>
  <div class="die"><img src="../assets/dice/d8.png" alt=""><span class="name">d8</span></div>
  <div class="die"><img src="../assets/dice/d10.png" alt=""><span class="name">d10</span></div>
  <div class="die"><img src="../assets/dice/d12.png" alt=""><span class="name">d12</span></div>
  <div class="die"><img src="../assets/dice/d20.png" alt=""><span class="name">d20</span></div>
</body></html>
