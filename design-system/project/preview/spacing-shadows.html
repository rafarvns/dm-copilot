<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 28px; font-family: var(--font-body); color: var(--color-text); display:grid; grid-template-columns: repeat(4,1fr); gap: 22px; align-items:start; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); height: 90px; display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); margin-top: 8px; display:block; }
</style></head>
<body>
  <div><div class="card" style="box-shadow: var(--shadow-sm);">shadow-sm</div><span class="lbl">0 1 2 · α30%</span></div>
  <div><div class="card" style="box-shadow: var(--shadow-md);">shadow-md</div><span class="lbl">0 4 6 · α40%</span></div>
  <div><div class="card" style="box-shadow: var(--shadow-lg);">shadow-lg</div><span class="lbl">0 10 15 · α50% · modals</span></div>
  <div><div class="card" style="box-shadow: var(--shadow-glow); border-color: var(--color-primary-light);">shadow-glow</div><span class="lbl">0 0 20 · arcane aura</span></div>
</body></html>
