<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 18px 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; box-sizing: border-box; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height: 70px; border-radius: var(--radius-md); border: 1px solid var(--color-border); display:flex; align-items:flex-end; padding: 8px; font-family: var(--font-body); font-size: 11px; font-weight:600; }
  .lbl { display:flex; flex-direction:column; gap:2px; font-size:11px; font-family: var(--font-body); }
  .lbl b { color: var(--color-text); font-weight:600; }
  .hex { font-family: var(--font-mono); color: var(--color-text-muted); font-size: 10px; }
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:#f59e0b; color:#1a1a24;">titles, init.</div><div class="lbl"><b>accent-gold</b><span class="hex">#f59e0b</span></div></div>
  <div class="sw"><div class="chip" style="background:#10b981; color:#0f0f14;">success</div><div class="lbl"><b>accent-emerald</b><span class="hex">#10b981</span></div></div>
  <div class="sw"><div class="chip" style="background:#f43f5e; color:#fff;">danger, HP</div><div class="lbl"><b>accent-rose</b><span class="hex">#f43f5e</span></div></div>
  <div class="sw"><div class="chip" style="background:#0ea5e9; color:#0f0f14;">info, AC</div><div class="lbl"><b>accent-sky</b><span class="hex">#0ea5e9</span></div></div>
</body></html>
