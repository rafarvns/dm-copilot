<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 22px 28px; font-family: var(--font-body); color: var(--color-text); display:grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
  .box { background: var(--color-surface); border: 1px solid var(--color-border); height: 80px; display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); margin-top: 6px; display:block; }
</style></head>
<body>
  <div><div class="box" style="border-radius:4px;">radius-sm</div><span class="lbl">4 px · chips, pills</span></div>
  <div><div class="box" style="border-radius:8px;">radius-md</div><span class="lbl">8 px · buttons, inputs</span></div>
  <div><div class="box" style="border-radius:12px;">radius-lg</div><span class="lbl">12 px · cards</span></div>
  <div><div class="box" style="border-radius:16px;">radius-xl</div><span class="lbl">16 px · modals</span></div>
</body></html>
