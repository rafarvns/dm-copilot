<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--color-bg); padding: 22px 28px; color: var(--color-text); font-family: var(--font-body); display:flex; gap: 28px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:8px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
  .total { font-family: var(--font-display); font-size: 64px; font-weight: 700; color: var(--color-primary-light); line-height: 1; }
  .notation { font-family: var(--font-mono); font-size: 14px; color: var(--color-text); }
  .timestamp { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); }
</style></head>
<body>
  <div class="col">
    <span class="meta">Dice total · Nodesto 700 · 64px</span>
    <span class="total">23</span>
  </div>
  <div class="col">
    <span class="meta">Notation · JetBrains Mono</span>
    <span class="notation">2d20kh1 + 5</span>
    <span class="notation">3d6 + 2d8 + 4</span>
    <span class="timestamp">14:27 · 21/04/2025</span>
  </div>
</body></html>
