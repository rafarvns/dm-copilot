appId: com.dmcopilot.app
productName: DM Copilot
directories:
  output: dist
publish:
  provider: github
  owner: rafarvns
  repo: dm-copilot
# better-sqlite3 já é rebuildado pelo postinstall (electron-rebuild) no runner
# correto. Sem isso, o electron-builder tenta rebuildar de novo e quebra no
# Windows ao invocar pnpm.cjs direto via fork/exec.
npmRebuild: false
files:
  - out/**/*
  - src/assets/**/*
  # node_modules completo: o main process roda com externalizeDepsPlugin do
  # electron-vite, então express/socket.io/youtube-dl-exec e suas transitivas
  # (body-parser etc.) precisam estar no asar. devDependencies são filtradas
  # automaticamente pelo electron-builder.
  - node_modules/**/*
# Binários nativos não podem ser executados de dentro do app.asar — precisam
# estar em app.asar.unpacked/. yt-dlp.exe é o caso atual; better-sqlite3.node
# também precisa ficar fora do asar para o Electron carregar o binding.
asarUnpack:
  - node_modules/youtube-dl-exec/bin/**
  - node_modules/**/youtube-dl-exec/bin/**
  - node_modules/better-sqlite3/**
  - node_modules/**/better-sqlite3/**
win:
  target:
    - nsis
  icon: src/assets/icons/logo_ico.ico
# Nome do artefato SEM espaços: o electron-updater gera o latest.yml com hífens,
# mas a API de upload do GitHub Release substitui espaços por pontos. Forçar
# hífens no build evita o mismatch que quebra o download da atualização.
nsis:
  artifactName: DM-Copilot-Setup-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: src/assets/icons/logo_ico.ico
mac:
  target:
    - dmg
  icon: src/assets/icons/logo_ico.ico