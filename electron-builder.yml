appId: com.dmcopilot.app
productName: DM Copilot
directories:
  output: dist
# better-sqlite3 já é rebuildado pelo postinstall (electron-rebuild) no runner
# correto. Sem isso, o electron-builder tenta rebuildar de novo e quebra no
# Windows ao invocar pnpm.cjs direto via fork/exec.
npmRebuild: false
files:
  - out/**/*
  - src/assets/**/*
  - node_modules/better-sqlite3/**/*
win:
  target:
    - nsis
  icon: src/assets/icons/logo_ico.ico
linux:
  target:
    - AppImage
    - deb
  icon: src/assets/icons/logo_ico.ico
mac:
  target:
    - dmg
  icon: src/assets/icons/logo_ico.ico