<section class="dashboard animate-fade-in">

  <header class="dashboard__greeting">
    <h1 class="dashboard__title">Bem-vindo, Mestre</h1>
    <p class="dashboard__subtitle" id="dash-greeting-date">
      <!-- preenchido pelo JS: ex "Quinta, 7 de maio" -->
    </p>
  </header>

  <section class="dashboard__section dashboard__continue" aria-labelledby="dash-continue-title">
    <h2 class="dashboard-section__title" id="dash-continue-title">Continuar</h2>
    <div id="dash-continue-slot">
      <!-- skeleton inicial; JS substitui por .continue-card OU .continue-empty -->
      <div class="continue-card continue-card--skeleton">
        <div class="continue-card__skeleton-line"></div>
        <div class="continue-card__skeleton-line continue-card__skeleton-line--short"></div>
      </div>
    </div>
  </section>

  <section class="dashboard__section dashboard__quick-actions" aria-labelledby="dash-actions-title">
    <h2 class="dashboard-section__title" id="dash-actions-title">Ações Rápidas</h2>
    <div class="quick-actions__row">
      <button class="btn btn--primary btn--lg" data-action="new-campaign">
        <i class="btn__icon" data-icon="plus"></i>
        <span>Nova Campanha</span>
      </button>
      <button class="btn btn--secondary btn--lg" data-action="new-character">
        <i class="btn__icon" data-icon="plus"></i>
        <span>Novo Personagem</span>
      </button>
    </div>
  </section>

  <section class="dashboard__section dashboard__shortcuts" aria-labelledby="dash-shortcuts-title">
    <h2 class="dashboard-section__title" id="dash-shortcuts-title">Atalhos</h2>
    <div class="shortcuts-grid">
      <button class="shortcut-card" data-action="open-campaigns">
        <span class="shortcut-card__icon"><i data-icon="castle"></i></span>
        <span class="shortcut-card__title">Campanhas</span>
        <span class="shortcut-card__hint" id="dash-count-campaigns">— campanhas</span>
      </button>
      <button class="shortcut-card" data-action="open-characters">
        <span class="shortcut-card__icon"><i data-icon="wand-sparkles"></i></span>
        <span class="shortcut-card__title">Personagens</span>
        <span class="shortcut-card__hint" id="dash-count-characters">— personagens</span>
      </button>
      <button class="shortcut-card" data-action="open-dice">
        <span class="shortcut-card__icon"><i data-icon="dices"></i></span>
        <span class="shortcut-card__title">Dados</span>
        <span class="shortcut-card__hint">Rolar dados 3D</span>
      </button>
    </div>
  </section>

</section>
