<section class="dice-roller">
  <header class="dice-roller__header">
    <div class="dice-roller__header-text">
      <h1 class="dice-roller__title">Rolagem de Dados</h1>
      <p class="dice-roller__subtitle">Selecione os dados, ajuste o bônus e clique em ROLL. As rolagens feitas aqui não são salvas no histórico.</p>
    </div>
    <div class="dice-roller__header-actions" id="dice-roller-toolbar-slot"></div>
  </header>

  <div class="dice-roller__log-header">
    <h2 class="dice-roller__log-title">
      <i data-icon="history" class="dice-roller__log-title-icon"></i>
      Histórico da sessão
    </h2>
    <button class="btn btn--ghost dice-roller__clear" data-action="clear" type="button">
      <i data-icon="trash-2"></i>
      Limpar log
    </button>
  </div>

  <ul class="dice-roller__log" id="dice-roller-log"></ul>
</section>
